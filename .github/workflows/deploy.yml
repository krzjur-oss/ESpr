name: Publikacja na GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zainstaluj zależności
        # Wymaga obecności pliku package-lock.json w repozytorium
        run: npm ci

      - name: Sprawdź typy TypeScript
        run: npm run lint

      - name: Zbuduj aplikację produkcyjną (PWA)
        run: npm run build

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prześlij artefakt strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
